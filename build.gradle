plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Xander Maven"
        url = "https://maven.isxander.dev/releases"
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    // Loom automatically adds the required repositories.
    // Add custom repositories here only if you depend on external mods.
}



fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "offlineskins-reloaded" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation("dev.isxander:yet-another-config-lib:${yacl_version}")
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE.txt") {
        rename { "LICENSE_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
        // Publishing repositories go here.
    }
}