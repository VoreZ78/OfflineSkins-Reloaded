modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

displayURL="https://modrinth.com/mod/offlineskins-reloaded"

logoFile="icon.png"

authors="VoreZ, zlainsama"

description='''
OfflineSkins Reloaded for Forge.
Caches player skins and capes for offline use.

With the user-friendly menu!
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="yet_another_config_lib_v3"
mandatory=true
versionRange="[3.6.6,)"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="offlineskins-reloaded-mixins.json"

